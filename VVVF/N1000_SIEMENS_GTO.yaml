# VVVF Geeks Motor Sound Configuration - Berlin S-Bahn BR 481
train_model: "BR 481"
sound_type: "IGBT-VVVF"
creator_note: "Berlin S-Bahn BR 481 sound profile for VVVF Geeks simulator"

frequency_curves:
  # Kalkış anındaki senkronize taşıyıcı frekans adımları (Bip sesleri)
  synchronous_stages:
    - min_speed: 0
      max_speed: 5
      start_freq: 350
      end_freq: 450
      wave_type: "sine"
    - min_speed: 5
      max_speed: 12
      start_freq: 450
      end_freq: 600
      wave_type: "sine"
  
  # Hızlandıkça asenkron moda geçiş ve ana uğultu tonu
  asynchronous_stage:
    min_speed: 12
    max_speed: 100
    base_frequency: 150
    frequency_multiplier: 12.5
    wave_type: "sawtooth"

harmonics:
  - order: 1
    amplitude: 1.0
  - order: 3
    amplitude: 0.4
  - order: 5
    amplitude: 0.2

volume_envelope:
  acceleration:
    0_kmh: 0.8
    10_kmh: 1.0
    50_kmh: 0.7
    100_kmh: 0.4
  deceleration:
    braking_ratio: 1.2
